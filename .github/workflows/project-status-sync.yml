name: Project Status Sync

on:
  pull_request:
    types:
      - closed

jobs:

  sync-status:

    if: github.event.pull_request.merged == true

    runs-on: ubuntu-latest

    steps:

      - name: Show event information
        run: |
          echo "PR Number: ${{ github.event.pull_request.number }}"
          echo "Base Branch: ${{ github.base_ref }}"
          echo "Head Branch: ${{ github.head_ref }}"

      - name: Determine target status
        run: |

          if [[ "${{ github.base_ref }}" == "develop" ]]; then
            echo "STATUS=In Development" >> $GITHUB_ENV

          elif [[ "${{ github.base_ref }}" == "staging" ]]; then
            echo "STATUS=In Staging" >> $GITHUB_ENV

          elif [[ "${{ github.base_ref }}" == "main" ]]; then
            echo "STATUS=Done" >> $GITHUB_ENV

          else
            echo "STATUS=UNKNOWN" >> $GITHUB_ENV

          fi

      - name: Determine Status Option ID
        run: |
            if [[ "${{ github.base_ref }}" == "develop" ]]; then
                echo "OPTION_ID=${{ vars.STATUS_IN_DEVELOPMENT }}" >> $GITHUB_ENV

            elif [[ "${{ github.base_ref }}" == "staging" ]]; then
                echo "OPTION_ID=${{ vars.STATUS_IN_STAGING }}" >> $GITHUB_ENV

            elif [[ "${{ github.base_ref }}" == "main" ]]; then
                echo "OPTION_ID=${{ vars.STATUS_DONE }}" >> $GITHUB_ENV

            fi

      - name: Show Option ID Mapping
        run: |
          echo "Selected Option ID: $OPTION_ID"

      - name: Prepare Project Update
        run: |
          echo "PROJECT_ID=${{ vars.PROJECT_ID }}" >> GITHUB_ENV
          echo "FIELD_ID=${{ vars.STATUS_FIELD_ID }}" >> GITHUB_ENV

          echo "Project ready:"
          echo "Project ID: ${{ vars.PROJECT_ID }}"
          echo "Field ID: ${{ vars.STATUS_FIELD_ID }}"
          echo "Option ID: $OPTION_ID"

      - name: Show status mapping
        run: |
          echo "Mapped status: $STATUS"

      - name: Show Project Configuration
        run: |
          echo "Project ID: ${{ vars.PROJECT_ID }}"
          echo "Field ID: ${{ vars.STATUS_FIELD_ID }}"
          echo "Backlog: ${{ vars.STATUS_BACKLOG }}"
          echo "In Development: ${{ vars.STATUS_IN_DEVELOPMENT }}"
          echo "Ready For QA: ${{ vars.STATUS_READY_FOR_QA }}"
          echo "In Staging: ${{ vars.STATUS_IN_STAGING }}"
          echo "Done: ${{ vars.STATUS_DONE }}"

      - name: Verify Project Token
        env:
          PROJECT_PAT: ${{ secrets.PROJECT_PAT }}
        run: |

          if [ -z "$PROJECT_PAT" ]; then
            echo "PROJECT_PAT missing"
            exit 1
          fi

          echo "PROJECT_PAT detected"

      - name: Test GraphQL Access
        env:
            PROJECT_PAT: ${{ secrets.PROJECT_PAT }}
            PROJECT_ID: ${{ vars.PROJECT_ID }}
        run: |
            curl -s \
                -H "Authorization: Bearer $PROJECT_PAT" \
                -H "Content-Type: application/json" \
                -X POST https://api.github.com/graphql \
                -d "{\"query\":\"query { node(id: \\\"$PROJECT_ID\\\") { ... on ProjectV2 { title id } } }\"}"

      - name: Discover Project Items
        env:
          PROJECT_PAT: ${{ secrets.PROJECT_PAT }}
          PROJECT_ID: ${{ vars.PROJECT_ID }}
        run: |

          curl -s \
            -H "Authorization: Bearer $PROJECT_PAT" \
            -H "Content-Type: application/json" \
            -X POST https://api.github.com/graphql \
            -d "{\"query\":\"query { node(id: \\\"$PROJECT_ID\\\") { ... on ProjectV2 { items(first: 20) { nodes { id content { ... on Issue { number title } } } } } } }\"}"

      - name: Discover Status Field Metadata
        env:
          PROJECT_PAT: ${{ secrets.PROJECT_PAT }}
          PROJECT_ID: ${{ vars.PROJECT_ID }}
        run: |

          curl -s \
            -H "Authorization: Bearer $PROJECT_PAT" \
            -H "Content-Type: application/json" \
            -X POST https://api.github.com/graphql \
            -d "{\"query\":\"query { node(id: \\\"$PROJECT_ID\\\") { ... on ProjectV2 { fields(first: 20) { nodes { __typename ... on ProjectV2SingleSelectField { id name options { id name } } } } } } }\"}"

      - name: Inspect Profile Item Fields
        env:
          PROJECT_PAT: ${{ secrets.PROJECT_PAT }}
        run: |

          curl -s \
            -H "Authorization: Bearer $PROJECT_PAT" \
            -H "Content-Type: application/json" \
            -X POST https://api.github.com/graphql \
            -d "{
              \"query\":\"query { node(id:\\\"PVTI_lAHOErY1784Bfm-Yzg1lcA0\\\") { ... on ProjectV2Item { fieldValues(first:20) { nodes { __typename ... on ProjectV2ItemFieldSingleSelectValue { name optionId field { ... on ProjectV2SingleSelectField { id name } } } } } } } }\" 
            }"

      - name: Update Project Item Status
        env:
          PROJECT_PAT: ${{ secrets.PROJECT_PAT }}
        run: |

          curl -s \
            -H "Authorization: Bearer $PROJECT_PAT" \
            -H "Content-Type: application/json" \
            -X POST https://api.github.com/graphql \
            -d "{
              "query":"mutation { updateProjectV2ItemFieldValue(input:{ projectId:\"PVT_kwHOFrY1784Bfm-Y\" itemId:\"PVTI_lAHOErY1784Bfm-Yzg1lcA0\" fieldId:\"${{ vars.STATUS_FIELD_ID }}\" value:{ singleSelectOptionId:\"$OPTION_ID\" } }) { projectV2Item { id } } }"
            }"
        